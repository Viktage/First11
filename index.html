<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Office Dashboard</title>
    <!-- Подключаем Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 16px;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #232e3c);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .status {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #4CAF50;
            border-radius: 50%;
            margin-right: 6px;
        }
        button {
            width: 100%;
            background-color: var(--tg-theme-button-color, #2ea6ff);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h2>📊 AI-Офис Дашборд</h2>

    <div class="card">
        <p><span class="status"></span> <b>Статус системы:</b> Активна</p>
        <p>⚡ <b>Модель:</b> Gemini 3.5 Flash</p>
        <p>👥 <b>Агенты:</b> Элис (Ассистент), Инженер (Техлид)</p>
    </div>

    <div class="card">
        <h3>⚡ Быстрые действия</h3>
        <button onclick="sendAction('reset_memory')">🧹 Очистить память (SQLite)</button>
        <button onclick="sendAction('ping_agents')">🤖 Проверить статус агентов</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        function sendAction(actionType) {
            // Отправляем данные обратно боту в Telegram
            tg.sendData(JSON.stringify({ action: actionType }));
        }
    </script>
</body>
</html>
